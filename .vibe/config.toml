# Project settings for Vibe: run the Live Notes script without a permission prompt.
# A list here replaces Vibe's default, so its default read-only commands are repeated
# (Vibe 3.1.3, POSIX bash). Only the last two lines are new.
[tools.bash]
allowlist = [
    "cd", "echo", "git diff", "git log", "git status", "tree", "whoami",
    "basename", "cat", "comm", "cut", "date", "diff", "dirname", "du", "file", "find",
    "fmt", "fold", "grep", "head", "join", "less", "ls", "md5sum", "more", "nl", "od",
    "paste", "pwd", "readlink", "sha1sum", "sha256sum", "shasum", "sort", "stat", "sum",
    "tac", "tail", "tr", "uname", "uniq", "wc", "which",
    "python live_notes.py",
    "python3 live_notes.py",
]
